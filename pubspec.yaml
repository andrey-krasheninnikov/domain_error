name: domain_error
description: Domain errors with Result, DomainResult, and captureResult for expected errors in Dart applications.
version: 5.0.3
repository: https://github.com/andrey-krasheninnikov/domain_error
homepage: https://github.com/andrey-krasheninnikov/domain_error
issue_tracker: https://github.com/andrey-krasheninnikov/domain_error/issues
topics:
  - error-handling
  - domain
  - exceptions
screenshots:
  - description: Domain errors and explicit success or error results for Dart and Flutter.
    path: assets/cover.png
  - description: The complete journey from operation outcome through captureResult to fold.
    path: assets/overview.png
  - description: DomainError fields, feature hierarchy, and stable type identifiers.
    path: assets/flow.png
  - description: Async and sync APIs, Result branches, fold, and map behavior.
    path: assets/fold.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  collection: ^1.17.1
  equatable: ^2.0.7
  meta: ^1.9.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.5
